<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Africa Games — Jeux de plateau africains</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .card { max-width: 560px; }
    .logo {
      width: 96px; height: 96px; margin: 0 auto 24px;
      background: linear-gradient(135deg, #FFD700, #FFA500);
      border-radius: 24px; display: flex; align-items: center;
      justify-content: center; font-size: 48px;
      box-shadow: 0 10px 40px rgba(255, 200, 0, .3);
    }
    h1 {
      font-size: 2.2rem; letter-spacing: 2px;
      background: linear-gradient(90deg, #FFD700, #FFA500, #FFD700);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    p.tagline { margin: 12px 0 28px; color: rgba(255,255,255,.75); font-size: 1.05rem; }
    .games { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 32px; }
    .chip {
      padding: 8px 16px; border-radius: 20px; font-size: .9rem;
      background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15);
    }
    a.store {
      display: inline-block; padding: 14px 32px; border-radius: 16px;
      background: linear-gradient(135deg, #27AE60, #219653);
      color: #fff; text-decoration: none; font-weight: 700; font-size: 1.05rem;
      box-shadow: 0 8px 30px rgba(39,174,96,.35);
    }
    footer { margin-top: 36px; font-size: .8rem; color: rgba(255,255,255,.4); }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🎲</div>
    <h1>AFRICA GAMES</h1>
    <p class="tagline">Ludo, Awalé, Xam Xam, Undercover — les jeux de plateau africains, réunis dans une seule app. Made in Sénégal 🇸🇳</p>
    <div class="games">
      <span class="chip">🎲 Ludo</span>
      <span class="chip">🌰 Awalé</span>
      <span class="chip">❓ Xam Xam</span>
      <span class="chip">🕵️ Undercover</span>
    </div>
    <a class="store" href="https://play.google.com/store/apps/details?id=com.symposieum.africaludo">Télécharger sur Google Play</a>
    <footer>© 2026 Africa Games · contact : fatimtapha@gmail.com</footer>
  </div>
</body>
</html>
